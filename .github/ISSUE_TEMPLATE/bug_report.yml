name: Bug report
description: 报告可复现的代码、训练、推理或数据处理问题
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢报告问题。MambaIR-GPPNN 是 Experimental v2.2 研究软件；请提供最小、可复现且不含敏感数据的示例。
  - type: dropdown
    id: area
    attributes:
      label: 问题范围
      options:
        - 模型或前向计算
        - 训练
        - 推理或评估
        - 数据加载或预处理
        - 命令行接口
        - 文档
        - 其他
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清楚说明发生了什么，以及该问题造成的影响。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 提供最小命令、输入形状、配置和必要的前置条件。
      placeholder: |
        1. 安装……
        2. 运行……
        3. 观察到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 说明你预期发生的结果。
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: 提交版本
      description: 提供 `git rev-parse HEAD` 的输出或 GitHub 提交链接。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 包括操作系统、Python、PyTorch、CUDA 和 GPU/CPU 信息。
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或错误信息
      description: 粘贴完整且已删除密钥、路径隐私和数据内容的相关输出。
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue，未发现相同问题。
          required: true
        - label: 我没有附加私有数据、访问令牌、模型权重或其他敏感内容。
          required: true
        - label: 这不是尚未公开修复的安全漏洞；安全问题将按 SECURITY.md 私密报告。
          required: true
