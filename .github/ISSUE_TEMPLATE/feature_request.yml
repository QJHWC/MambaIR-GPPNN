name: Feature request
description: 建议范围明确、可验证的功能或改进
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请说明真实使用场景和验证方法。涉及新算法或破坏兼容性的改动，应先通过本 Issue 达成范围共识。
  - type: textarea
    id: problem
    attributes:
      label: 使用场景或问题
      description: 说明当前限制、受影响的用户和为什么需要改变。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述预期行为、输入输出和必要的兼容性考虑。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 说明现有功能或其他实现为什么不能满足需要。
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: 验证与完成标准
      description: 列出测试、实验或文档标准，用于判断功能已经完成。
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: 兼容性与风险
      description: 说明对公开 API、CLI、权重、数据格式、性能和依赖的影响。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue 和文档，未发现相同建议。
          required: true
        - label: 我已将建议与未经验证的性能结论区分开。
          required: true
        - label: 如方案使用第三方材料，我会提供来源、许可和修改说明。
          required: true
