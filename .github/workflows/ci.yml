name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.10 CPU
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu \
            "torch>=2.0,<3" "torchvision>=0.15,<1"
          python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q models data tests *.py

      - name: Check critical Python errors
        run: python -m ruff check .

      - name: Run unit and repository tests
        run: python -m pytest

      - name: Check command-line help
        run: |
          python train_unified.py --help
          python train.py --help
          python test_256_fair.py --help
          python test_512_fair.py --help
          python inference_with_world_model.py --help

      - name: Check shell syntax
        shell: bash
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(git ls-files -z -- '*.sh')
