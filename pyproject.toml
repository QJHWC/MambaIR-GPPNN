[tool.pytest.ini_options]
minversion = "7.4"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py310"
line-length = 100
respect-gitignore = true
extend-exclude = [
    ".cargo",
    "checkpoints*",
    "logs*",
    "photo",
    "results*",
]

[tool.ruff.lint]
# Fail CI only for syntax errors, invalid constructs, and undefined names.
select = ["E9", "F63", "F7", "F82"]
